[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oq-tsunami-ext"
version = "0.1.0"
description = "OpenQuake Engine extension for tsunami IMT and epistemic event-rate integration"
requires-python = ">=3.9"
# NOTE: do NOT pin openquake.engine here. We want to support editable installs
# of a local oq-engine checkout at v3.25.1.
dependencies = [
  "numpy",
  "pandas",
]

[project.scripts]
oq-tsunami = "oq_tsunami_ext.cli:main"

[tool.ruff]
line-length = 88
target-version = "py39"
